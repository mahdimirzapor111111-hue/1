    <script>
      // Android bridge and navigation back button fallback handler
      window.handleAndroidBack = function() {
        var closeBtns = document.querySelectorAll('button[title*="بستن"], button[aria-label*="بستن"], button:has(svg.lucide-x)');
        for (var i = 0; i < closeBtns.length; i++) {
          if (closeBtns[i].offsetParent !== null) {
            closeBtns[i].click();
            return true;
          }
        }
        return false;
      };
      if (window.navigator) {
        window.navigator.vibrate = function(pattern) {
          if (window.AndroidBridge && window.AndroidBridge.vibrate) {
            var ms = Array.isArray(pattern) ? (pattern[0] || 40) : (pattern || 40);
            window.AndroidBridge.vibrate(ms);
            return true;
          }
          return false;
        };
      }
    </script>
